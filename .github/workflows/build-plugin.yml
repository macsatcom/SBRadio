name: Build LMS plugin

# Builds the "SB Radio Applets" LMS plugin when plugin/SBRadio/install.xml has
# a version without a release, publishes it as a GitHub Release and updates
# repo.xml (the LMS plugin repository users add in LMS).

on:
  push:
    branches: [main]
    paths: ["plugin/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-commit
  cancel-in-progress: false

jobs:
  plugin:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Read version
        id: v
        run: |
          ver=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' plugin/SBRadio/install.xml | head -1)
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=SBRadioPlugin-v$ver" >> "$GITHUB_OUTPUT"
          if gh release view "SBRadioPlugin-v$ver" >/dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"; echo "release exists"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build ZIP and repo.xml
        if: steps.v.outputs.build == 'true'
        env:
          VER: ${{ steps.v.outputs.version }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          mkdir -p dist
          (cd plugin && zip -X -r "../dist/SBRadio-$VER.zip" SBRadio -x '*/.*')
          unzip -l "dist/SBRadio-$VER.zip"
          sha=$(sha1sum "dist/SBRadio-$VER.zip" | cut -c1-40)
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/SBRadio-$VER.zip"
          cat > repo.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <extensions>
            <details>
              <title lang="EN">SB Radio Applets</title>
            </details>
            <plugins>
              <plugin name="SBRadio" version="$VER" minTarget="7.9" maxTarget="*">
                <title lang="EN">SB Radio Applets</title>
                <desc lang="EN">Offers Standalone Radio and Spotify Connect to Squeezebox Radio and Touch in the Applet Installer. The players download the applets from this LMS over plain HTTP.</desc>
                <creator>macsatcom</creator>
                <category>tools</category>
                <link>https://github.com/$GITHUB_REPOSITORY</link>
                <url>$url</url>
                <sha>$sha</sha>
              </plugin>
            </plugins>
          </extensions>
          EOF
          sed -i 's/^          //' repo.xml
          python3 -c "import xml.etree.ElementTree as E;E.parse('repo.xml')"
          cat repo.xml

      - name: Publish release
        if: steps.v.outputs.build == 'true'
        env:
          VER: ${{ steps.v.outputs.version }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          gh release create "$TAG" "dist/SBRadio-$VER.zip" --title "SB Radio Applets plugin $VER" \
            --notes "LMS plugin. Install via LMS → Settings → Manage Plugins with repository https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/repo.xml" \
            --latest=false

      - name: Commit repo.xml
        if: steps.v.outputs.build == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo.xml
          git commit -m "Update repo.xml for plugin ${{ steps.v.outputs.version }}"
          git pull --rebase
          git push
